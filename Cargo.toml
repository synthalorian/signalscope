[package]
name = "signalscope"
version = "0.1.0"
edition = "2021"
authors = ["synthalorian"]
description = "SDR spectrum analyzer with retro oscilloscope UI"
license = "MIT"
repository = "https://github.com/synthalorian/signalscope"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtlsdr = { version = "0.1.4", optional = true }
rustfft = "6.4.1"
num-complex = "0.4.6"
ctrlc = "3.5.2"
libloading = "0.8"
libc = "0.2"

# SDR support (optional features for different backends)
# rtlsdr = { version = "0.2", optional = true }
# hackrf = { version = "0.2", optional = true }

# wgpu for retro oscilloscope renderer
# wgpu = "0.19"
# winit = "0.29"
# pollster = "0.3"

[features]
default = []
rtlsdr = ["dep:rtlsdr"]
hackrf = []

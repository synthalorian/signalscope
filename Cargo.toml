[package]
name = "signalscope"
version = "1.0.0"
edition = "2021"
authors = ["synth"]
description = "SDR spectrum analyzer with retro oscilloscope UI"
license = "Apache-2.0"
repository = "https://github.com/synthalorian/signalscope"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtlsdr = { version = "0.1.4", optional = true }
rustfft = "6.4.1"
num-complex = "0.4.6"
ctrlc = "3.5.2"
libloading = "0.8"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# SDR support (optional feature; requires system librtlsdr)
# rtlsdr = { version = "0.1.4", optional = true } is declared above.

[features]
default = []
# NOTE: There is intentionally no `hackrf` feature. HackRF support is not
# implemented; see the roadmap in README.md.
rtlsdr = ["dep:rtlsdr"]
